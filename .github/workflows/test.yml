name: 自动化测试

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests pytest allure-pytest

      - name: 检查代码语法
        run: |
          python -m py_compile test_login.py
          python -m py_compile test_dish.py
          python -m py_compile conftest.py
          echo "所有文件语法检查通过"

      - name: 运行接口测试（后端不可用时跳过）
        run: |
          python -m pytest test_login.py test_dish.py -v --alluredir=allure-results
        continue-on-error: true

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: allure-results/